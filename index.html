<style>html{--safe-top:env(safe-area-inset-top,0px);--safe-right:env(safe-area-inset-right,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--safe-left:env(safe-area-inset-left,0px)}html,body{margin:0;height:100%;background:#0d0b14;overflow:hidden;touch-action:none;user-select:none}canvas{position:absolute;image-rendering:pixelated}
#pwa{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);display:none;align-items:center;gap:10px;padding:7px 8px 7px 14px;background:#2b2545;color:#ffd64a;border:2px solid #ffd64a;border-radius:4px;font:700 13px/1 system-ui,sans-serif;z-index:9;touch-action:manipulation}
#pwa button{font:inherit;color:inherit;background:none;border:0;padding:4px 6px;cursor:pointer}
#pwa .x{color:#9cf;font-weight:400}
#rotateNotice{display:none;position:fixed;inset:0;z-index:100;background:#0d0b14;color:#f5f0ff;align-items:center;justify-content:center;flex-direction:column;gap:14px;padding:24px;text-align:center;font:700 16px/1.5 system-ui,sans-serif;touch-action:none}
#rotateNotice .phone{width:72px;height:116px;border:4px solid #ffd64a;border-radius:12px;position:relative;transform:rotate(90deg);margin:8px 0 18px}
#rotateNotice .phone:after{content:'';position:absolute;width:18px;height:4px;border-radius:4px;background:#ffd64a;bottom:5px;left:calc(50% - 9px)}
#rotateNotice strong{font-size:20px;color:#ffd64a}
#rotateNotice span{max-width:300px;color:#c6c2d8;font-size:13px}
@media (orientation:portrait) and (max-width:900px) and (pointer:coarse){#rotateNotice{display:flex}}</style></head><body><canvas id="c" width="640" height="360"></canvas>
